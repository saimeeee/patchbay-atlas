name: Atlas checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_demo.py
      - run: git diff --exit-code -- index.html
      - run: python tools/build_zipapp.py patchbay-atlas.pyz
      - run: python patchbay-atlas.pyz . -o smoke.html
